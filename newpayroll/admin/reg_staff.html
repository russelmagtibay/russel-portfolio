<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Register Staff — Payroll Automation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" type="text/css" />
<link rel="stylesheet" href="../css/theme.css" type="text/css" />
<style>
  body { background: #f1f5f9; padding: 24px 12px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    border-radius: 12px 12px 0 0;
  }
  .nav-bar-custom {
    background: #0f172a;
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .nav-bar-custom a {
    color: #e2e8f0;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    transition: background .15s;
  }
  .nav-bar-custom a:hover, .nav-bar-custom a.active {
    background: #2563eb;
    color: #fff;
  }
</style>
</head>

<body>
<div id="outerwrapper" class="mx-auto" style="max-width:1150px;">
  <div class="toolbar">
    <div>
      <h5 class="m-0 fw-bold text-dark">✍️ Register New Staff</h5>
      <small class="text-muted">Enroll a new employee into the payroll registry</small>
    </div>
    <a href="../index.html" class="btn btn-outline-danger btn-sm">Sign Out</a>
  </div>

  <nav class="nav-bar-custom">
    <a href="index.html">HOME</a>
    <a href="view_staff.html">VIEW STAFF</a>
    <a href="reg_staff.html" class="active">REGISTER STAFF</a>
    <a href="payroll.html">PAYROLL SUMMARY</a>
    <a href="print.html">PRINT PAYSLIP</a>
    <a href="../../index.html#projects" style="margin-left:auto; background:rgba(255,255,255,.1);">← Portfolio</a>
  </nav>

  <div class="p-4 bg-white" style="border-radius: 0 0 12px 12px;">

    <div class="card p-4 border mx-auto" style="max-width:720px;">
      <div id="regSuccessAlert" class="alert alert-success d-none" role="alert">
        🎉 Staff registered successfully! Redirecting to staff directory...
      </div>

      <form id="regStaffForm" class="row g-3">
        <div class="col-md-8">
          <label class="form-label small fw-bold">Full Name</label>
          <input type="text" class="form-control" id="fname" placeholder="e.g. Maria Santos" required />
        </div>

        <div class="col-md-4">
          <label class="form-label small fw-bold">Gender</label>
          <select class="form-select" id="sex" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Date of Birth</label>
          <input type="date" class="form-control" id="birthday" value="1995-05-15" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Department</label>
          <select class="form-select" id="department" required>
            <option value="I.T.">I.T.</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Accounting">Accounting</option>
            <option value="Administration">Administration</option>
            <option value="Marketing">Marketing</option>
            <option value="Production">Production</option>
            <option value="Research">Research</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Job Position</label>
          <input type="text" class="form-control" id="position" placeholder="e.g. Cloud Engineer" required />
        </div>

        <div class="col-md-3">
          <label class="form-label small fw-bold">Grade Level</label>
          <input type="number" class="form-control" id="grade" value="12" min="1" max="30" required />
        </div>

        <div class="col-md-3">
          <label class="form-label small fw-bold">Years of Service</label>
          <input type="number" class="form-control" id="years" value="3" min="0" max="50" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Basic Monthly Salary (PHP)</label>
          <input type="number" class="form-control" id="basic" value="650000" min="50000" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Username</label>
          <input type="text" class="form-control" id="username" placeholder="login username" required />
        </div>

        <div class="col-12 mt-4 text-end">
          <a href="view_staff.html" class="btn btn-outline-secondary me-2">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Register Staff Member →</button>
        </div>
      </form>
    </div>

  </div>
</div>

<script src="../js/payroll-data.js"></script>
<script>
  document.getElementById('regStaffForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const newStaff = {
      fname: document.getElementById('fname').value,
      sex: document.getElementById('sex').value,
      birthday: document.getElementById('birthday').value,
      department: document.getElementById('department').value,
      position: document.getElementById('position').value,
      grade: document.getElementById('grade').value,
      years: document.getElementById('years').value,
      basic: parseFloat(document.getElementById('basic').value) || 500000,
      username: document.getElementById('username').value
    };

    addStaff(newStaff);

    document.getElementById('regSuccessAlert').classList.remove('d-none');
    setTimeout(() => {
      window.location.href = 'view_staff.html';
    }, 1200);
  });
</script>
</body>
</html>
