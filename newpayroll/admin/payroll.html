<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payroll Summary — Payroll Automation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" type="text/css" />
<link rel="stylesheet" href="../css/theme.css" type="text/css" />
<style>
  body { background: #f1f5f9; padding: 24px 12px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    border-radius: 12px 12px 0 0;
  }
  .nav-bar-custom {
    background: #0f172a;
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .nav-bar-custom a {
    color: #e2e8f0;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    transition: background .15s;
  }
  .nav-bar-custom a:hover, .nav-bar-custom a.active {
    background: #2563eb;
    color: #fff;
  }
</style>
</head>

<body>
<div id="outerwrapper" class="mx-auto" style="max-width:1150px;">
  <div class="toolbar">
    <div>
      <h5 class="m-0 fw-bold text-dark">💰 Monthly Payroll Computations</h5>
      <small class="text-muted">Salary schedule, benefits, tax deductions, and net payouts</small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success btn-sm" onclick="window.print()">🖨️ Export Payroll</button>
      <a href="../index.html" class="btn btn-outline-danger btn-sm">Sign Out</a>
    </div>
  </div>

  <nav class="nav-bar-custom">
    <a href="index.html">HOME</a>
    <a href="view_staff.html">VIEW STAFF</a>
    <a href="reg_staff.html">REGISTER STAFF</a>
    <a href="payroll.html" class="active">PAYROLL SUMMARY</a>
    <a href="print.html">PRINT PAYSLIP</a>
    <a href="../../index.html#projects" style="margin-left:auto; background:rgba(255,255,255,.1);">← Portfolio</a>
  </nav>

  <div class="p-4 bg-white" style="border-radius: 0 0 12px 12px;">
    <div class="table-responsive">
      <table class="table table-bordered table-sm align-middle">
        <thead class="table-light">
          <tr class="text-center small">
            <th>ID</th>
            <th>Staff Name</th>
            <th>Department</th>
            <th>Basic Salary</th>
            <th>Meal Allow.</th>
            <th>Housing</th>
            <th>Transport</th>
            <th>Tax Withheld</th>
            <th>Net Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="payrollTableBody" class="small">
          <!-- Dynamically populated -->
        </tbody>
        <tfoot class="table-dark fw-bold" id="payrollTableFoot">
          <!-- Sums -->
        </tfoot>
      </table>
    </div>
  </div>
</div>

<script src="../js/payroll-data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const list = getStaffList();
    const tbody = document.getElementById('payrollTableBody');

    let sumBasic = 0, sumMeal = 0, sumHousing = 0, sumTransport = 0, sumTax = 0, sumTotal = 0;

    tbody.innerHTML = list.map(s => {
      const basic = s.basic || 0;
      const meal = s.meal || 0;
      const housing = s.housing || 0;
      const transport = s.transport || 0;
      const tax = s.tax || 0;
      const total = s.totall || 0;

      sumBasic += basic;
      sumMeal += meal;
      sumHousing += housing;
      sumTransport += transport;
      sumTax += tax;
      sumTotal += total;

      return `
        <tr>
          <td class="text-center">#${s.staff_id}</td>
          <td class="fw-bold">${s.fname}</td>
          <td><span class="badge bg-light text-dark border">${s.department}</span></td>
          <td class="text-end">${formatCurrency(basic)}</td>
          <td class="text-end">${formatCurrency(meal)}</td>
          <td class="text-end">${formatCurrency(housing)}</td>
          <td class="text-end">${formatCurrency(transport)}</td>
          <td class="text-end text-danger">${formatCurrency(tax)}</td>
          <td class="text-end fw-bold text-success">${formatCurrency(total)}</td>
          <td class="text-center">
            <a href="print.html?id=${s.staff_id}" class="btn btn-sm btn-outline-primary py-0 px-2">Slip</a>
          </td>
        </tr>
      `;
    }).join('');

    document.getElementById('payrollTableFoot').innerHTML = `
      <tr>
        <td colspan="3" class="text-center">TOTALS (${list.length} Staff)</td>
        <td class="text-end">${formatCurrency(sumBasic)}</td>
        <td class="text-end">${formatCurrency(sumMeal)}</td>
        <td class="text-end">${formatCurrency(sumHousing)}</td>
        <td class="text-end">${formatCurrency(sumTransport)}</td>
        <td class="text-end">${formatCurrency(sumTax)}</td>
        <td class="text-end text-warning">${formatCurrency(sumTotal)}</td>
        <td></td>
      </tr>
    `;
  });
</script>
</body>
</html>
