<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Staff Directory — Payroll Automation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" type="text/css" />
<link rel="stylesheet" href="../css/theme.css" type="text/css" />
<style>
  body { background: #f1f5f9; padding: 24px 12px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    border-radius: 12px 12px 0 0;
  }
  .nav-bar-custom {
    background: #0f172a;
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .nav-bar-custom a {
    color: #e2e8f0;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    transition: background .15s;
  }
  .nav-bar-custom a:hover, .nav-bar-custom a.active {
    background: #2563eb;
    color: #fff;
  }
</style>
</head>

<body>
<div id="outerwrapper" class="mx-auto" style="max-width:1150px;">
  <div class="toolbar">
    <div>
      <h5 class="m-0 fw-bold text-dark">👥 Staff Directory</h5>
      <small class="text-muted">Manage registered personnel records</small>
    </div>
    <div class="d-flex gap-2">
      <a href="reg_staff.html" class="btn btn-primary btn-sm">+ Register New Staff</a>
      <a href="../index.html" class="btn btn-outline-danger btn-sm">Sign Out</a>
    </div>
  </div>

  <nav class="nav-bar-custom">
    <a href="index.html">HOME</a>
    <a href="view_staff.html" class="active">VIEW STAFF</a>
    <a href="reg_staff.html">REGISTER STAFF</a>
    <a href="payroll.html">PAYROLL SUMMARY</a>
    <a href="print.html">PRINT PAYSLIP</a>
    <a href="../../index.html#projects" style="margin-left:auto; background:rgba(255,255,255,.1);">← Portfolio</a>
  </nav>

  <div class="p-4 bg-white" style="border-radius: 0 0 12px 12px;">

    <!-- Filter Bar -->
    <div class="row g-2 mb-3 align-items-center">
      <div class="col-md-6">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by name, position, or department..." />
      </div>
      <div class="col-md-4">
        <select id="deptFilter" class="form-select">
          <option value="">All Departments</option>
          <option value="I.T.">I.T.</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Accounting">Accounting</option>
          <option value="Administration">Administration</option>
          <option value="Marketing">Marketing</option>
          <option value="Production">Production</option>
          <option value="Research">Research</option>
        </select>
      </div>
      <div class="col-md-2 text-md-end text-muted small">
        <span id="staffCountBadge" class="fw-bold text-dark">14</span> Staff Members
      </div>
    </div>

    <!-- Staff Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th width="60">ID</th>
            <th>Name</th>
            <th>Sex</th>
            <th>Department</th>
            <th>Position</th>
            <th>Service</th>
            <th>Registered</th>
            <th width="150" class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="staffTableBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="../js/payroll-data.js"></script>
<script>
  let allStaff = [];

  function renderTable(data) {
    const tbody = document.getElementById('staffTableBody');
    document.getElementById('staffCountBadge').textContent = data.length;

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No staff found matching criteria.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(s => `
      <tr>
        <td class="text-center"><span class="badge bg-light text-dark border">#${s.staff_id}</span></td>
        <td class="fw-bold">${s.fname}</td>
        <td>${s.sex === 'Male' ? '👨 Male' : '👩 Female'}</td>
        <td><span class="badge bg-secondary">${s.department}</span></td>
        <td>${s.position}</td>
        <td>${s.years || '10'} yrs</td>
        <td class="small text-muted">${s.date_registered || '2013-06-30'}</td>
        <td class="text-center">
          <div class="btn-group btn-group-sm">
            <a href="print.html?id=${s.staff_id}" class="btn btn-outline-primary" title="Print Payslip">Slip</a>
            <button type="button" class="btn btn-outline-danger btn-delete" data-id="${s.staff_id}">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(e.currentTarget.getAttribute('data-id'), 10);
        if (confirm(`Are you sure you want to remove staff #${id}?`)) {
          allStaff = deleteStaff(id);
          filterAndRender();
        }
      });
    });
  }

  function filterAndRender() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const dept = document.getElementById('deptFilter').value;

    const filtered = allStaff.filter(s => {
      const matchQ = s.fname.toLowerCase().includes(q) || s.position.toLowerCase().includes(q) || s.department.toLowerCase().includes(q);
      const matchDept = !dept || s.department === dept;
      return matchQ && matchDept;
    });

    renderTable(filtered);
  }

  document.addEventListener('DOMContentLoaded', () => {
    allStaff = getStaffList();
    renderTable(allStaff);

    document.getElementById('searchInput').addEventListener('input', filterAndRender);
    document.getElementById('deptFilter').addEventListener('change', filterAndRender);
  });
</script>
</body>
</html>
