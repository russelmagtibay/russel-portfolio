<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payroll Automation — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
  body {
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .login-card {
    max-width: 440px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    overflow: hidden;
    background: #ffffff;
  }
  .brand {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #fff;
    padding: 24px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .toggle .btn { width: 50%; }
  .demo-badge {
    background: #e0f2fe;
    color: #0369a1;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 600;
  }
  .btn-demo {
    font-size: 12.5px;
    padding: 6px 12px;
  }
</style>
</head>

<body>
  <div class="card login-card">
    <div class="brand">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h5 class="m-0 fw-bold">💼 Payroll Automation</h5>
        <span class="demo-badge">Vercel Demo</span>
      </div>
      <small class="text-white-50">Enterprise staff management &amp; salary computation</small>
    </div>

    <div class="p-4">
      <div class="btn-group w-100 toggle mb-3" role="group" aria-label="Login type toggle">
        <button type="button" id="btn-admin" class="btn btn-primary fw-bold">Admin Portal</button>
        <button type="button" id="btn-staff" class="btn btn-outline-primary fw-bold">Staff Portal</button>
      </div>

      <!-- Quick Demo Access Bar -->
      <div class="p-2 bg-light rounded-3 mb-3 border text-center">
        <div class="small text-muted mb-1 fw-semibold">Quick 1-Click Access:</div>
        <div class="d-flex gap-2 justify-content-center">
          <a href="admin/index.html" class="btn btn-sm btn-outline-dark btn-demo">Admin Demo →</a>
          <a href="employee/index.html" class="btn btn-sm btn-outline-secondary btn-demo">Staff Demo →</a>
        </div>
      </div>

      <!-- Admin Form -->
      <form id="form-admin" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-bold">Admin Username</label>
          <input type="text" id="adminUser" name="username" class="form-control" value="russel" required />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" id="adminPass" name="password" class="form-control" value="russel" required />
        </div>
        <div class="d-grid">
          <button class="btn btn-primary py-2 fw-bold" type="submit">Sign In as Admin</button>
        </div>
      </form>

      <!-- Staff Form -->
      <form id="form-staff" class="d-none" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-bold">Staff ID</label>
          <input type="text" id="staffId" name="staff_id" class="form-control" value="1" required />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Username</label>
          <input type="text" id="staffUser" name="username" class="form-control" value="russel" required />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" id="staffPass" name="password" class="form-control" value="russel" required />
        </div>
        <div class="d-grid">
          <button class="btn btn-primary py-2 fw-bold" type="submit">Sign In as Staff</button>
        </div>
      </form>

      <div class="text-center mt-3">
        <a href="../index.html#projects" class="small text-decoration-none text-muted">← Back to Main Portfolio</a>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const adminBtn = document.getElementById('btn-admin');
  const staffBtn = document.getElementById('btn-staff');
  const adminForm = document.getElementById('form-admin');
  const staffForm = document.getElementById('form-staff');

  function showAdmin(){
    adminBtn.classList.add('btn-primary');
    adminBtn.classList.remove('btn-outline-primary');
    staffBtn.classList.add('btn-outline-primary');
    staffBtn.classList.remove('btn-primary');
    adminForm.classList.remove('d-none');
    staffForm.classList.add('d-none');
  }

  function showStaff(){
    staffBtn.classList.add('btn-primary');
    staffBtn.classList.remove('btn-outline-primary');
    adminBtn.classList.add('btn-outline-primary');
    adminBtn.classList.remove('btn-primary');
    staffForm.classList.remove('d-none');
    adminForm.classList.add('d-none');
  }

  adminBtn.addEventListener('click', showAdmin);
  staffBtn.addEventListener('click', showStaff);

  adminForm.addEventListener('submit', (e) => {
    e.preventDefault();
    localStorage.setItem('payroll_auth', JSON.stringify({ role: 'admin', user: 'russel' }));
    window.location.href = 'admin/index.html';
  });

  staffForm.addEventListener('submit', (e) => {
    e.preventDefault();
    localStorage.setItem('payroll_auth', JSON.stringify({ role: 'staff', user: 'russel', staff_id: 1 }));
    window.location.href = 'employee/index.html';
  });
</script>
</body>
</html>
